<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NAV — Navegación</title>
<script src="PNG/zbuildgs.js"></script>
<script src='https://api.mapbox.com/mapbox-gl-js/v3.26.0/mapbox-gl.js'></script>
<link href='https://api.mapbox.com/mapbox-gl-js/v3.26.0/mapbox-gl.css' rel='stylesheet' />
<style>
:root{--bg:#0a0a0c;--panel:#141418;--panel2:#1c1c22;--line:#2a2a32;--txt:#e8e8ec;--dim:#8888a0;--acc:#4f8cff;--ok:#3dd68c;--warn:#ffb84f;--err:#ff5f5f}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,sans-serif}
#map{position:absolute;inset:0}
/* ---- top bar ---- */
#topbar{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;gap:8px;padding:10px 12px;background:linear-gradient(to bottom,rgba(0,0,0,.75),transparent);pointer-events:none}
#topbar>*{pointer-events:auto}
#searchbox{flex:1;display:flex;gap:6px}
#dest-input{flex:1;padding:10px 14px;background:rgba(20,20,24,.9);border:1px solid var(--line);border-radius:10px;color:var(--txt);font-size:15px;outline:none}
#dest-input:focus{border-color:var(--acc)}
.btn{padding:9px 16px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--txt);font-size:14px;cursor:pointer;white-space:nowrap;transition:background .15s}
.btn:hover{background:#282830}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.primary:hover{background:#3d7aef}
.btn.stop{background:var(--err);border-color:var(--err);color:#fff}
/* ---- maneuver banner ---- */
#banner{position:absolute;top:56px;left:12px;right:12px;z-index:15;display:none;align-items:center;gap:14px;padding:12px 18px;background:rgba(16,16,20,.94);border:1px solid var(--line);border-radius:14px}
#banner .dist{font-size:26px;font-weight:700;color:var(--acc);min-width:110px}
#banner .instr{flex:1;font-size:15px;line-height:1.3}
#banner .eta{text-align:right;font-size:13px;color:var(--dim);line-height:1.5}
#banner .eta b{display:block;font-size:17px;color:var(--txt)}
/* ---- bottom info ---- */
#bottombar{position:absolute;bottom:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:16px;padding:10px 16px;background:linear-gradient(to top,rgba(0,0,0,.8),transparent);pointer-events:none}
#bottombar>*{pointer-events:auto}
#speedo{padding:8px 14px;background:rgba(16,16,20,.9);border:1px solid var(--line);border-radius:12px;text-align:center}
#speedo .v{font-size:24px;font-weight:700}
#speedo .u{font-size:10px;color:var(--dim)}
/* ---- settings panel ---- */
#settings{position:absolute;top:0;right:-380px;width:360px;max-width:92vw;height:100%;z-index:40;background:var(--panel);border-left:1px solid var(--line);transition:right .25s ease;overflow-y:auto;padding:16px}
#settings.open{right:0}
#settings h2{font-size:17px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
#settings h2 .close{cursor:pointer;font-size:22px;color:var(--dim);padding:0 6px}
.setgroup{margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.setgroup:last-child{border-bottom:none}
.setgroup label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.setgroup select,.setgroup input[type=text]{width:100%;padding:9px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--txt);font-size:14px;outline:none}
.setgroup select:focus{border-color:var(--acc)}
.togglerow{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
.togglerow span{font-size:14px}
.switch{position:relative;width:44px;height:24px;background:var(--line);border-radius:12px;cursor:pointer;transition:background .2s}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;background:#888;border-radius:50%;transition:all .2s}
.switch.on{background:var(--acc)}
.switch.on::after{left:23px;background:#fff}
/* car position sliders */
.posrow{display:flex;align-items:center;gap:10px;padding:6px 0}
.posrow label{width:20px;font-size:13px;color:var(--dim);margin:0}
.posrow input[type=range]{flex:1;accent-color:var(--acc)}
.posrow .val{width:42px;text-align:right;font-size:12px;color:var(--dim)}
/* voice test */
.voicetest{display:flex;gap:8px;margin-top:8px}
.voicetest .btn{flex:1;text-align:center;font-size:13px}
/* ---- car marker ---- */
#car{position:absolute;z-index:10;pointer-events:none;transform:translate(-50%,-50%);transition:none}
#car svg{filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))}
/* ---- toast ---- */
#toast{position:absolute;bottom:70px;left:50%;transform:translateX(-50%);z-index:50;padding:10px 20px;background:rgba(16,16,20,.95);border:1px solid var(--line);border-radius:10px;font-size:14px;display:none;max-width:80vw}
/* ---- search results ---- */
#results{position:absolute;top:100px;left:12px;right:12px;z-index:30;background:rgba(16,16,20,.96);border:1px solid var(--line);border-radius:12px;display:none;max-height:260px;overflow-y:auto}
#results .item{padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--line);font-size:14px}
#results .item:hover{background:var(--panel2)}
#results .item small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
/* gear button */
#gear{position:absolute;top:10px;right:12px;z-index:21;width:42px;height:42px;background:rgba(20,20,24,.9);border:1px solid var(--line);border-radius:10px;color:var(--txt);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#gear:hover{background:#282830}
/* ---- speed at top center ---- */
#speedTop{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:21;padding:8px 18px;background:rgba(16,16,20,.9);border:1px solid var(--line);border-radius:12px;text-align:center;pointer-events:none}
#speedTop .v{font-size:26px;font-weight:700;line-height:1.1}
#speedTop .u{font-size:10px;color:var(--dim)}
</style>
</head>
<body>

<div id="map"></div>

<!-- car marker (screen-space, positioned by %) -->
<div id="car">
<svg width="42" height="42" viewBox="0 0 64 64">
  <path d="M32 6 C34 6 36 8 37 11 L46 34 C47 37 45 40 42 40 L22 40 C19 40 17 37 18 34 L27 11 C28 8 30 6 32 6 Z" fill="#4f8cff" stroke="#fff" stroke-width="2.5"/>
  <circle cx="32" cy="26" r="5" fill="#fff" opacity=".85"/>
</svg>
</div>

<div id="topbar">
  <div id="searchbox">
    <input id="dest-input" type="text" placeholder="Buscar destino…" autocomplete="off">
    <button class="btn primary" id="btn-go">Ruta</button>
  </div>
</div>
<button id="gear" title="Ajustes">⚙</button>

<div id="speedTop"><div class="v" id="spd-top">0</div><div class="u">km/h</div></div>

<div id="banner">
  <div class="dist" id="b-dist">—</div>
  <div class="instr" id="b-instr">—</div>
  <div class="eta"><b id="b-eta">—</b><span id="b-arr">—</span></div>
</div>

<div id="results"></div>

<div id="bottombar">
  <button class="btn" id="btn-center">⌖ Centrar</button>
  <button class="btn stop" id="btn-stop" style="display:none">■ Fin</button>
</div>

<div id="settings">
  <h2>Ajustes <span class="close" id="set-close">✕</span></h2>

  <div class="setgroup">
    <label>Proveedor del mapa</label>
    <select id="s-map-provider">
      <option value="osm">OpenStreetMap / Google raster (sin token, recomendado)</option>
      <option value="mapbox">Mapbox (vector, 3D — requiere token con acceso a estilos)</option>
    </select>
  </div>

  <div class="setgroup">
    <label>Estilo del mapa</label>
    <select id="s-map-style">
      <option value="streets">Calles</option>
      <option value="dark">Oscuro</option>
      <option value="satellite">Satélite</option>
      <option value="hybrid">Satélite + Calles</option>
    </select>
  </div>

  <div class="setgroup">
    <div class="togglerow"><span>Edificios 3D</span><div class="switch" id="s-3d"></div></div>
  </div>

  <div class="setgroup">
    <label>Proveedor de rutas</label>
    <select id="s-route-provider">
      <option value="osrm">OSRM (gratis, sin key)</option>
      <option value="mapbox">Mapbox Directions (con tráfico)</option>
    </select>
  </div>

  <div class="setgroup">
    <label>Guiado por voz</label>
    <select id="s-voice-mode">
      <option value="silence">Silencio</option>
      <option value="sounds">Solo pitidos</option>
      <option value="voice">Voz + pitidos</option>
    </select>
    <label style="margin-top:10px">Motor de voz</label>
    <select id="s-voice-engine">
      <option value="native">Navegador (TTS offline)</option>
      <option value="clips">Clips pre-generados (WAV)</option>
    </select>
    <div class="voicetest">
      <button class="btn" id="btn-test-voice">🔊 Probar voz</button>
      <button class="btn" id="btn-test-beep">🔔 Probar pitido</button>
    </div>
  </div>

  <div class="setgroup">
    <label>Posición del coche en pantalla</label>
    <div class="posrow"><label>X</label><input type="range" id="s-car-x" min="0" max="100" value="50"><span class="val" id="v-car-x">50%</span></div>
    <div class="posrow"><label>Y</label><input type="range" id="s-car-y" min="0" max="100" value="30"><span class="val" id="v-car-y">30%</span></div>
    <small style="color:var(--dim);font-size:11px;display:block;margin-top:4px">X: 0=izquierda → 100=derecha · Y: 0=abajo → 100=arriba</small>
  </div>

  <div class="setgroup">
    <label>Cámara</label>
    <div class="posrow"><label>📐</label><input type="range" id="s-pitch" min="0" max="75" value="62"><span class="val" id="v-pitch">62°</span></div>
    <div class="posrow"><label>🔍</label><input type="range" id="s-zoom" min="12" max="19" step="0.5" value="15.5"><span class="val" id="v-zoom">15.5</span></div>
    <div class="togglerow"><span>Orientar mapa según marcha</span><div class="switch on" id="s-heading"></div></div>
    <div class="togglerow"><span>Mapa anclado al vehículo</span><div class="switch on" id="s-follow"></div></div>
  </div>
</div>

<div id="toast"></div>

<script>
"use strict";
/* ================================================================
   NAV — punto de entrada limpio de navegación
   Mapa: Mapbox GL (vector) u OSM raster · Estilo: calles/oscuro/satélite
   3D buildings on/off · Rutas: OSRM (gratis) o Mapbox
   Voz: TTS nativo o clips WAV · Coche: posición % en pantalla
================================================================ */

/* ---------- settings (localStorage) ---------- */
const LS='nav_';
const S={
  mapProvider: localStorage.getItem(LS+'mapProvider')||'osm', // raster por defecto: el token Mapbox no tiene acceso a estilos mapbox:// (403)
  mapStyle:    localStorage.getItem(LS+'mapStyle')||'streets',
  buildings3d: localStorage.getItem(LS+'buildings3d')==='true',
  routeProvider:localStorage.getItem(LS+'routeProvider')||'osrm',
  voiceMode:   localStorage.getItem(LS+'voiceMode')||'voice',
  voiceEngine: localStorage.getItem(LS+'voiceEngine')||'native',
  carX:        parseInt(localStorage.getItem(LS+'carX'))||50,
  carY:        parseInt(localStorage.getItem(LS+'carY'))||30,
  pitch:       parseFloat(localStorage.getItem(LS+'pitch'))!=null?parseFloat(localStorage.getItem(LS+'pitch')):62, // 3D perspectiva (igual que tesla.html)
  zoom:        parseFloat(localStorage.getItem(LS+'zoom'))!=null?parseFloat(localStorage.getItem(LS+'zoom')):15.5, // vista cercana al coche (igual que tesla.html)
  heading:     localStorage.getItem(LS+'heading')!=='false',  // orientar mapa según marcha
  follow:      localStorage.getItem(LS+'follow')!=='false',   // mapa anclado al vehículo
};
function saveS(k,v){S[k]=v;localStorage.setItem(LS+k,v);}

/* ---------- toast ---------- */
let toastTimer=null;
function toast(msg,ms=2500){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.display='block';
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.style.display='none',ms);
}

/* ---------- audio: beeps (Web Audio) ---------- */
let beepCtx=null;
function ensureBeepCtx(){
  if(!beepCtx){try{beepCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}
  if(beepCtx.state==='suspended')beepCtx.resume();
  return beepCtx;
}
function beep(f0,f1,durMs,vol=0.25,type='sine',when=0){
  const ctx=ensureBeepCtx();if(!ctx)return;
  const t0=ctx.currentTime+when,d=durMs/1000;
  const osc=ctx.createOscillator(),g=ctx.createGain(),m=ctx.createGain();
  m.gain.value=4.0;
  osc.type=type;
  osc.frequency.setValueAtTime(f0,t0);
  osc.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t0+d);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol,t0+0.008);
  g.gain.setValueAtTime(vol,t0+Math.max(0.008,d-0.008));
  g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
  osc.connect(g).connect(m).connect(ctx.destination);
  osc.start(t0);osc.stop(t0+d+0.05);
}
function alertSound(kind){
  switch(kind){
    case 'far':beep(880,660,180,.18);beep(660,550,180,.18,'sine',.22);break;
    case 'medium':beep(740,740,120,.22,'square');beep(740,740,120,.22,'square',.18);beep(740,740,120,.22,'square',.36);break;
    case 'near':beep(1100,1100,90,.3,'square');beep(1100,1100,90,.3,'square',.14);break;
    case 'roundabout-exit':beep(520,780,130,.3,'triangle');beep(780,520,130,.3,'triangle',.15);beep(520,780,130,.3,'triangle',.30);break;
    case 'arrive':beep(523,523,140,.25);beep(659,659,140,.25,'sine',.16);beep(784,784,220,.25,'sine',.32);break;
    case 'reroute':beep(440,440,100,.2,'sawtooth');beep(440,440,100,.2,'sawtooth',.14);break;
    default:beep(660,660,140,.2);
  }
}

/* ---------- voice: clips (WAV synthesized in memory) ---------- */
const NAV_CLIPS={
  far:'En dos kilometros',medium:'En quinientos metros',near:'Ahora',
  roundabout:'Salida de rotonda',left:'Gire a la izquierda',right:'Gire a la derecha',
  straight:'Continue recto',uturn:'Cambio de sentido',arrive:'Ha llegado a su destino',
  start:'Ruta iniciada',reroute:'Recalculando ruta',
};
let clipsCtx=null;const clipsCache=new Map();
function ensureClipsCtx(){
  if(!clipsCtx){try{clipsCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}
  if(clipsCtx.state==='suspended')clipsCtx.resume();
  return clipsCtx;
}
function synthesizeClipWav(text){
  const sr=16000,syl=Math.max(3,(text.match(/[aeiou]/gi)||[]).length);
  const durS=Math.min(2.2,0.16+syl*0.11),n=Math.floor(sr*durS);
  const buf=new ArrayBuffer(44+n*2),v=new DataView(buf);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');
  v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);
  w(36,'data');v.setUint32(40,n*2,true);
  let seed=0;for(const c of text)seed=(seed*31+c.charCodeAt(0))&0xffff;
  for(let i=0;i<n;i++){
    const t=i/sr,s=Math.floor(t/0.11)%Math.max(1,syl);
    const f0=140+((seed+s*37)%60);
    const fm=1+0.35*Math.sin(2*Math.PI*(220+s*40)*t);
    const env=Math.min(1,t/0.02)*Math.min(1,(durS-t)/0.06);
    const val=Math.sin(2*Math.PI*f0*t)*fm*env*0.5;
    v.setInt16(44+i*2,Math.max(-32768,Math.min(32767,Math.round(val*32767))),true);
  }
  return buf;
}
async function playClip(text){
  const ctx=ensureClipsCtx();if(!ctx)return;
  try{
    let audio=clipsCache.get(text);
    if(!audio){audio=await ctx.decodeAudioData(synthesizeClipWav(text).buffer);clipsCache.set(text,audio);}
    const src=ctx.createBufferSource(),g=ctx.createGain();
    g.gain.value=1.6;src.buffer=audio;
    src.connect(g).connect(ctx.destination);src.start();
  }catch(e){speakNative(text);}
}
function speakWithClips(text){
  const l=(text||'').toLowerCase();
  let clip=NAV_CLIPS.straight;
  if(l.includes('rotonda'))clip=NAV_CLIPS.roundabout;
  else if(l.includes('izquierda'))clip=NAV_CLIPS.left;
  else if(l.includes('derecha'))clip=NAV_CLIPS.right;
  else if(l.includes('cambio de sentido'))clip=NAV_CLIPS.uturn;
  else if(l.includes('llegado')||l.includes('destino'))clip=NAV_CLIPS.arrive;
  else if(l.includes('recalc'))clip=NAV_CLIPS.reroute;
  let prefix=null;
  if(l.includes('dos kilometros')||l.includes('dos km'))prefix=NAV_CLIPS.far;
  else if(l.includes('quinientos'))prefix=NAV_CLIPS.medium;
  else if(l.includes('ahora'))prefix=NAV_CLIPS.near;
  if(prefix)playClip(prefix).then(()=>playClip(clip));else playClip(clip);
}
function speakNative(text){
  if(!window.speechSynthesis)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='es-ES';u.rate=1.05;u.volume=1;
  const vs=speechSynthesis.getVoices();
  const pref=vs.find(v=>v.lang==='es-ES'&&!v.name.includes('Google'))||vs.find(v=>v.lang.startsWith('es'));
  if(pref)u.voice=pref;
  speechSynthesis.speak(u);
}
function speak(text){
  if(S.voiceMode==='silence')return;
  if(S.voiceMode==='sounds'){alertSound('info');return;}
  if(S.voiceEngine==='clips')speakWithClips(text);else speakNative(text);
}

/* ---------- map ---------- */
mapboxgl.accessToken=window.APP_CONFIG.keys.mapbox;
let map=null;
const CAR_ICON='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="42" height="42" viewBox="0 0 64 64">'+
  '<path d="M32 6 C34 6 36 8 37 11 L46 34 C47 37 45 40 42 40 L22 40 C19 40 17 37 18 34 L27 11 C28 8 30 6 32 6 Z" fill="#4f8cff" stroke="#fff" stroke-width="2.5"/>'+
  '<circle cx="32" cy="26" r="5" fill="#fff" opacity=".85"/></svg>');

function buildVectorStyle(style){
  const styles={
    streets:'mapbox://styles/mapbox/standard?optimize=true',
    dark:'mapbox://styles/mapbox/dark-v11?optimize=true',
    satellite:'mapbox://styles/mapbox/satellite-v9?optimize=true',
    hybrid:'mapbox://styles/mapbox/satellite-streets-v12?optimize=true',
  };
  return styles[style]||styles.streets;
}
function buildRasterStyle(style){
  // Raster sin token. Satélite vía Google/Esri (los tiles mapbox.satellite
  // devuelven 403 con este token — mismo motivo por el que tesla.html usa
  // GOOGLE_RASTER_STYLE).
  let tiles,attr;
  if(style==='satellite'){
    tiles=['https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}'];attr='© Google';
  }else if(style==='hybrid'){
    tiles=['https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}'];attr='© Google';
  }else if(style==='dark'){
    tiles=['https://basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png'];attr='© OSM / CARTO';
  }else{
    tiles=['https://a.tile.openstreetmap.org/{z}/{x}/{y}.png','https://b.tile.openstreetmap.org/{z}/{x}/{y}.png','https://c.tile.openstreetmap.org/{z}/{x}/{y}.png'];attr='© OpenStreetMap';
  }
  return {
    version:8,
    glyphs:'https://fonts.openmaptiles.org/{fontstack}/{range}.pbf',
    sources:{
      basemap:{type:'raster',tiles,tileSize:256,attribution:attr},
    },
    layers:[
      {id:'bg',type:'background',paint:{'background-color':style==='dark'?'#0a0a0c':'#ddd'}},
      {id:'basemap',type:'raster',source:'basemap'},
    ],
  };
}

function initMap(){
  if(map){map.remove();map=null;}
  const style=S.mapProvider==='mapbox'?buildVectorStyle(S.mapStyle):buildRasterStyle(S.mapStyle);
  map=new mapboxgl.Map({
    container:'map',
    style,
    center:[-3.7038,40.4168],zoom:1.5,pitch:0,bearing:0, // vista mundial inicial (globo)
    attributionControl:false,
  });
  // Vista de globo terráqueo: se aplica por API (igual que tesla.html)
  try { if (typeof map.setProjection === 'function') map.setProjection('globe'); } catch(e){}
  map.on('style.load',()=>{ try { if (typeof map.setProjection === 'function') map.setProjection('globe'); } catch(e){} });
  map.on('load',()=>{
    addRouteLayers();
    if(S.buildings3d)add3DBuildings();
    applyCarPadding();
    locateUser();
  });
  window.addEventListener('resize',()=>applyCarPadding());
  map.on('error',e=>{
    const msg=e&&e.error&&e.error.message||e&&e.error&&e.error.status||'';
    if(msg.includes('Token'))
      toast('Error de token Mapbox — cambia proveedor a OSM',4000);
    // 403 en tiles de Mapbox: el token no tiene acceso a los estilos.
    // Fallback automático a raster (una sola vez por sesión).
    if((msg.includes('403')||msg.includes('Forbidden'))&&S.mapProvider==='mapbox'&&!window._mapbox403Handled){
      window._mapbox403Handled=true;
      toast('Mapbox sin acceso (403) — cambiando a mapa raster',4000);
      S.mapProvider='osm';saveS('mapProvider','osm');
      const sel=document.getElementById('s-map-provider');if(sel)sel.value='osm';
      initMap();
    }
  });
}

/* ---------- localización del usuario ----------
   1º GPS (geolocation API). Si falla (permiso denegado, contexto no
   seguro, sin GPS), intenta localización aproximada por IP como
   respaldo para que el mapa siempre se centre en algún sitio. */
function locateUser(){
  if(!navigator.geolocation){ fallbackIpLocation('Este navegador no soporta geolocalización'); return; }
  toast('Buscando posición GPS…');
  navigator.geolocation.getCurrentPosition(p=>{
    userPos=[p.coords.longitude,p.coords.latitude];
    onUserLocated(false);
  },err=>{
    const motivos={1:'Permiso de ubicación denegado',2:'Posición no disponible',3:'Tiempo de espera agotado'};
    fallbackIpLocation(motivos[err.code]||'Error de GPS');
  },{enableHighAccuracy:true,timeout:10000,maximumAge:30000});
}
async function fallbackIpLocation(motivo){
  toast(motivo+' — probando por IP…');
  try{
    const r=await fetch('https://ipapi.co/json/');
    const d=await r.json();
    if(d.longitude&&d.latitude){
      userPos=[d.longitude,d.latitude];
      onUserLocated(true);
      return;
    }
  }catch(e){}
  toast('Sin GPS ni IP: usando Madrid. Permite la ubicación para navegación real.',5000);
  userPos=[-3.7038,40.4168];
  onUserLocated(true);
}
function onUserLocated(aprox){
  updateUserMarker();
  bootFlyTo();
  toast(aprox?'Posición aproximada (IP). Activa el GPS para navegar.':'Posición GPS encontrada');
}

/* ---------- animación de arranque (copiada de tesla.html) ----------
   Globo terráqueo → flyTo con perspectiva 3D hasta la posición GPS.
   El flyTo de Mapbox usa su easing por arco (zoom out → zoom in), mucho
   más fino que un easeTo lineal. Igual que en tesla.html:
   - se fija el objetivo (center/zoom/pitch/bearing) ANTES de volar,
   - el bucle de cámara (updateCamera) no pisa el flyTo mientras dura,
   - se libera con setTimeout (duración + margen), NO con moveend
     (el jumpTo implícito del boot dispara un moveend espurio).
   El ancla de cámara usa la MISMA matemática que el bucle de seguimiento
   (offsets del coche en pantalla escalados por zoom) para que el flyTo
   aterrice EXACTAMENTE donde el bucle mantendrá la cámara: sin el ancla,
   el coche quedaría descentrado hasta el primer fix de GPS.
------------------------------------------------------------------ */
let isFlying=false;
function bootFlyTo(){
  if(!map||!userPos)return;
  const pitch=S.pitch, zoom=S.zoom, bearing=0;
  isFlying=true;
  // El centro del flyTo es userPos: con el setPadding de applyCarPadding
  // (ya aplicado al cargar el mapa), Mapbox pinta userPos exactamente en
  // la posición de pantalla del coche (carX/carY) — misma convención que
  // usa el bucle de seguimiento (updateCamera), sin dobles offsets.
  map.flyTo({
    center:userPos,
    zoom,
    pitch,
    bearing,
    duration:1800,
    essential:true,
  });
  // Al liberar isFlying, un updateCamera fuerza el asentado de la cámara
  // sobre el coche (corrige cualquier desviación residual del aterrizaje).
  setTimeout(()=>{isFlying=false;updateCamera();},1900);
}

function addRouteLayers(){
  if(map.getSource('route'))return;
  map.addSource('route',{type:'geojson',data:emptyGeo()});
  map.addLayer({id:'route-casing',type:'line',source:'route',
    paint:{'line-color':'#2a5fd0','line-width':9,'line-opacity':.6}});
  map.addLayer({id:'route-line',type:'line',source:'route',
    paint:{'line-color':'#4f8cff','line-width':6,'line-opacity':.9}});
  map.addLayer({id:'route-dash',type:'line',source:'route',
    paint:{'line-color':'#fff','line-width':2,'line-dasharray':[1,3],'line-opacity':.4}});
}
function add3DBuildings(){
  const layers=map.getStyle().layers;
  const labelLayer=layers?layers.find(l=>l.type==='symbol'&&l.layout&&l.layout['text-field']):null;
  const before=labelLayer?labelLayer.id:undefined;
  if(!map.getSource('buildings')){
    // For vector styles use openmaptiles building layer if present; for raster skip
    if(S.mapProvider!=='mapbox')return;
    map.addSource('buildings',{type:'vector',url:'mapbox://mapbox.buildings-v1'});
  }
  if(map.getLayer('buildings-3d'))return;
  map.addLayer({
    id:'buildings-3d',source:'buildings','source-layer':'building',
    type:'fill-extrusion',minzoom:14,
    paint:{
      'fill-extrusion-color':'#5a5a72',
      'fill-extrusion-height':['coalesce',['get','height'],10],
      'fill-extrusion-base':['coalesce',['get','min_height'],0],
      'fill-extrusion-opacity':0.55,
    },
  },before);
}
function remove3DBuildings(){if(map.getLayer('buildings-3d'))map.removeLayer('buildings-3d');}
function emptyGeo(){return{type:'FeatureCollection',features:[]};}

/* ---------- user location marker ---------- */
let userPos=null,userMarker=null,carHeading=null,lastPosForBearing=null;
function updateUserMarker(){
  if(!userPos)return;
  if(!userMarker){
    const el=document.createElement('div');
    el.style.cssText='width:16px;height:16px;border-radius:50%;background:#3dd68c;border:3px solid #fff;box-shadow:0 0 8px rgba(61,214,140,.7)';
    userMarker=new mapboxgl.Marker({el}).setLngLat(userPos).addTo(map);
  }else userMarker.setLngLat(userPos);
}

/* ---------- cámara: anclaje al coche ----------
   El centro visual del mapa se coloca exactamente en el punto donde
   está el icono del coche (posición % de pantalla) usando setPadding.
   Así, al mover los sliders, el mapa se re-ancla al coche y el icono
   SIEMPRE coincide con la posición GPS. */
function applyCarPadding(){
  if(!map)return;
  const el=map.getContainer();
  const w=el.clientWidth,h=el.clientHeight;
  if(!w||!h)return;
  const px=S.carX/100*w, py=(100-S.carY)/100*h; // py: desde arriba
  map.setPadding({left:px,right:w-px,top:py,bottom:h-py});
}

/* cámara suave: easeTo lineal en cada fix de GPS (sin saltos) */
let camBusy=false;
function updateCamera(){
  // Durante la transición inicial (isFlying) NUNCA tocar la cámara: un
  // easeTo con getZoom() intermedio arrastraría de vuelta al globo (bug
  // clásico de tesla.html, ver IACambios.md §2.1/§2.2).
  if(!map||!S.follow||!userPos||camBusy||isFlying)return;
  camBusy=true;
  map.easeTo({
    center:userPos,
    zoom:S.zoom,
    pitch:S.pitch,
    bearing:(S.heading&&carHeading!=null&&!isNaN(carHeading))?carHeading:0,
    duration:900,
    easing:t=>t, // lineal: sin aceleración brusca
  });
  setTimeout(()=>{camBusy=false;},900);
}

/* rotación del icono del coche: si el mapa gira con la marcha el icono
   apunta arriba; si el mapa va al norte, el icono rota según rumbo */
function updateCarRotation(){
  const svg=document.querySelector('#car svg');
  if(!svg)return;
  const rot=(S.heading||carHeading==null||isNaN(carHeading))?0:carHeading;
  svg.style.transform=`rotate(${rot}deg)`;
}
function computeHeading(p){
  if(p.coords.heading!=null&&!isNaN(p.coords.heading)&&p.coords.speed>0.5)
    return p.coords.heading;
  if(lastPosForBearing&&p.coords.speed>1){
    const dLon=(p.coords.longitude-lastPosForBearing[0])*Math.PI/180;
    const la1=lastPosForBearing[1]*Math.PI/180,la2=p.coords.latitude*Math.PI/180;
    const y=Math.sin(dLon)*Math.cos(la2);
    const x=Math.cos(la1)*Math.sin(la2)-Math.sin(la1)*Math.cos(la2)*Math.cos(dLon);
    return (Math.atan2(y,x)*180/Math.PI+360)%360;
  }
  return carHeading;
}

/* ---------- car screen position ---------- */
function updateCarPos(){
  const car=document.getElementById('car');
  // Y% : 0 = bottom → 100 = top  →  css top = (100 - Y)%
  car.style.left=S.carX+'%';
  car.style.top=(100-S.carY)+'%';
}

/* ---------- geocoding (Nominatim, free) ---------- */
let searchTimer=null;
const destInput=document.getElementById('dest-input');
const resultsBox=document.getElementById('results');
destInput.addEventListener('input',()=>{
  clearTimeout(searchTimer);
  const q=destInput.value.trim();
  if(q.length<3){resultsBox.style.display='none';return;}
  searchTimer=setTimeout(()=>doSearch(q),500);
});
async function doSearch(q){
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=6&accept-language=es`);
    const data=await r.json();
    if(!data.length){resultsBox.style.display='none';return;}
    resultsBox.innerHTML='';
    data.forEach(d=>{
      const div=document.createElement('div');
      div.className='item';
      div.innerHTML=d.display_name.split(',').slice(0,3).join(',')+'<small>'+d.display_name.split(',').slice(3,6).join(',')+'</small>';
      div.onclick=()=>{
        resultsBox.style.display='none';
        destInput.value=d.display_name.split(',')[0];
        const dest=[parseFloat(d.lon),parseFloat(d.lat)];
        calcRoute(dest);
      };
      resultsBox.appendChild(div);
    });
    resultsBox.style.display='block';
  }catch(e){toast('Error de búsqueda');}
}

/* ---------- routing ---------- */
let routeData=null;      // {coords, steps, distance, duration}
let destPoint=null;
let maneuverIdx=0;
let voiceFlags={};

async function calcRoute(dest){
  destPoint=dest;
  if(!userPos){toast('Esperando GPS…');return;}
  toast('Calculando ruta…');
  let ok=false;
  if(S.routeProvider==='osrm')ok=await routeOSRM();
  if(!ok&&S.routeProvider==='mapbox')ok=await routeOSRM(); // fallback
  if(!ok&&S.routeProvider==='osrm')ok=await routeMapbox();
  if(!ok){toast('No se pudo calcular la ruta',3000);return;}
  // success
  map.getSource('route').setData({type:'Feature',properties:{},geometry:{type:'LineString',coordinates:routeData.coords}});
  // la cámara sigue al coche (sin fitBounds brusco de toda la ruta)
  maneuverIdx=0;voiceFlags={};
  document.getElementById('btn-stop').style.display='';
  document.getElementById('banner').style.display='flex';
  speak(NAV_CLIPS.start);
  // El banner se rellena en el primer navTick (navTick también avanza la
  // maniobra actual, actualiza distancia/ETA y dispara la voz).
  startNavLoop();
}

async function routeOSRM(){
  try{
    const coords=`${userPos[0]},${userPos[1]};${destPoint[0]},${destPoint[1]}`;
    const url=`https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson&steps=true`;
    const ctrl=new AbortController();
    const t=setTimeout(()=>ctrl.abort(),6000);
    const r=await fetch(url,{signal:ctrl.signal});
    clearTimeout(t);
    const d=await r.json();
    if(d.code!=='Ok'||!d.routes||!d.routes.length)return false;
    const route=d.routes[0];
    routeData={
      coords:route.geometry.coordinates,
      distance:route.distance,
      duration:route.duration,
      steps:route.legs[0].steps,
    };
    return true;
  }catch(e){return false;}
}

async function routeMapbox(){
  try{
    const token=window.APP_CONFIG.keys.mapbox;
    const coords=`${userPos[0]},${userPos[1]};${destPoint[0]},${destPoint[1]}`;
    const params=new URLSearchParams({
      geometries:'geojson',overview:'full',steps:'true',
      language:'es',access_token:token,
    });
    const url=`https://api.mapbox.com/directions/v5/mapbox/driving/${coords}?${params}`;
    const r=await fetch(url);
    const d=await r.json();
    if(d.code!=='Ok'||!d.routes||!d.routes.length)return false;
    const route=d.routes[0];
    routeData={
      coords:route.geometry.coordinates,
      distance:route.distance,
      duration:route.duration,
      steps:route.legs[0].steps,
    };
    return true;
  }catch(e){return false;}
}

/* ---------- navigation loop ---------- */
let navInterval=null;
let lastGpsTime=0;

function startNavLoop(){
  stopNavLoop();
  navInterval=setInterval(navTick,1000);
}
function stopNavLoop(){
  if(navInterval){clearInterval(navInterval);navInterval=null;}
}
function navTick(){
  if(!routeData||!userPos)return;
  // find nearest point on route (distancia real en metros)
  let minD=Infinity,minI=0;
  for(let i=0;i<routeData.coords.length;i++){
    const d=haversine(userPos,routeData.coords[i]);
    if(d<minD){minD=d;minI=i;}
  }
  // remaining distance (rough: sum from minI to end)
  let remain=0;
  for(let i=minI;i<routeData.coords.length-1;i++){
    remain+=haversine(routeData.coords[i],routeData.coords[i+1]);
  }
  // find current maneuver
  let step=null,stepDist=Infinity;
  for(let i=maneuverIdx;i<routeData.steps.length;i++){
    const s=routeData.steps[i];
    // distance to maneuver start
    const md=haversine(userPos,s.maneuver.location);
    if(md<30&&i===maneuverIdx){maneuverIdx++;continue;}
    if(i===maneuverIdx){step=s;stepDist=md;break;}
  }
  if(!step){
    // arrived
    arrive();
    return;
  }
  // voice triggers
  checkVoice(step,stepDist);
  // update banner
  document.getElementById('b-dist').textContent=fmtDist(stepDist);
  document.getElementById('b-instr').textContent=stepName(step);
  const totalEta=routeData.duration*(remain/Math.max(routeData.distance,1));
  document.getElementById('b-eta').textContent=fmtTime(totalEta);
  const arr=new Date(Date.now()+totalEta*1000);
  document.getElementById('b-arr').textContent='llegada '+arr.getHours()+':'+String(arr.getMinutes()).padStart(2,'0');
  // check deviation (off route > 70m)
  if(minD>70){
    toast('Desviado — recalculando…');
    speak(NAV_CLIPS.reroute);alertSound('reroute');
    calcRoute(destPoint);
    return;
  }
}
function checkVoice(step,dist){
  const type=step.maneuver.type||'';
  const isRA=type==='exit-roundabout'||type==='roundabout';
  const kind=isRA?'roundabout-exit':null;
  if(dist<=2100&&dist>1900&&!voiceFlags.far){
    alertSound(kind||'far');
    if(S.voiceMode==='voice')speak('En dos kilometros, '+stepName(step));
    voiceFlags.far=true;
  }
  if(dist<=550&&dist>450&&!voiceFlags.medium){
    alertSound(kind||'medium');
    if(S.voiceMode==='voice')speak('En quinientos metros, '+stepName(step));
    voiceFlags.medium=true;
  }
  if(dist<=230&&dist>150&&!voiceFlags.near){
    alertSound(kind||'near');
    if(S.voiceMode==='voice')speak(stepName(step)+' ahora');
    voiceFlags.near=true;
  }
}
function stepName(step){
  const m=step.maneuver;
  const road=step.name||'';
  const dir={
    'left':'Gire a la izquierda','right':'Gire a la derecha',
    'sharp left':'Gire bruscamente a la izquierda','sharp right':'Gire bruscamente a la derecha',
    'slight left':'Ligeramente a la izquierda','slight right':'Ligeramente a la derecha',
    'straight':'Continue recto','uturn':'Cambio de sentido',
  }[m.modifier]||'Continue';
  switch(m.type){
    case 'depart':return 'Salida'+(road?' por '+road:'');
    case 'arrive':return 'Ha llegado a su destino';
    case 'roundabout':case 'rotary':return 'Entre a la rotonda';
    case 'exit-roundabout':case 'exit-rotary':return 'Salga de la rotonda';
    case 'new name':return 'Continue'+(road?' por '+road:'');
    case 'merge':return 'Incorpórese'+(road?' a '+road:'');
    case 'fork':return dir+(road?' en '+road:'');
    default:return dir+(road?' en '+road:'');
  }
}
function arrive(){
  stopNavLoop();
  alertSound('arrive');
  speak(NAV_CLIPS.arrive);
  toast('¡Ha llegado a su destino!',4000);
  document.getElementById('banner').style.display='none';
  document.getElementById('btn-stop').style.display='none';
  routeData=null;
}
function haversine(a,b){
  const R=6371000,dLat=(b[1]-a[1])*Math.PI/180,dLon=(b[0]-a[0])*Math.PI/180;
  const la1=a[1]*Math.PI/180,la2=b[1]*Math.PI/180;
  const h=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function fmtDist(m){
  if(m<1000)return Math.round(m)+' m';
  return (m/1000).toFixed(1)+' km';
}
function fmtTime(s){
  if(s<60)return Math.round(s)+' s';
  const m=Math.floor(s/60);
  if(m<60)return m+' min';
  return Math.floor(m/60)+' h '+(m%60)+' min';
}

/* ---------- GPS tracking ---------- */
let gpsWatch=null;
function startGps(){
  if(!navigator.geolocation)return;
  if(gpsWatch)navigator.geolocation.clearWatch(gpsWatch);
  gpsWatch=navigator.geolocation.watchPosition(p=>{
    userPos=[p.coords.longitude,p.coords.latitude];
    carHeading=computeHeading(p);
    lastPosForBearing=[p.coords.longitude,p.coords.latitude];
    updateUserMarker();
    updateCamera();
    updateCarRotation();
    // speed
    const spd=p.coords.speed!=null?Math.round(p.coords.speed*3.6):0;
    document.getElementById('spd-top').textContent=spd;
  },()=>{},{enableHighAccuracy:true,maximumAge:2000});
}
startGps();

/* ---------- UI wiring ---------- */
document.getElementById('btn-go').onclick=()=>{
  const q=destInput.value.trim();
  if(!q)return;
  doSearch(q);
};
destInput.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('btn-go').click();});

document.getElementById('btn-stop').onclick=()=>{
  stopNavLoop();
  routeData=null;destPoint=null;maneuverIdx=0;voiceFlags={};
  if(map.getSource('route'))map.getSource('route').setData(emptyGeo());
  document.getElementById('banner').style.display='none';
  document.getElementById('btn-stop').style.display='none';
  toast('Navegación finalizada');
};

document.getElementById('btn-center').onclick=()=>{
  if(userPos&&!isFlying)map.easeTo({center:userPos,zoom:S.zoom,pitch:S.pitch,duration:900,easing:t=>t});
};

/* settings panel */
const settingsPanel=document.getElementById('settings');
document.getElementById('gear').onclick=()=>settingsPanel.classList.toggle('open');
document.getElementById('set-close').onclick=()=>settingsPanel.classList.remove('open');

function bindSelect(id,key,cb){
  const el=document.getElementById(id);
  el.value=S[key];
  el.addEventListener('change',()=>{
    saveS(key,el.value);
    if(cb)cb(el.value);
  });
}
bindSelect('s-map-provider','mapProvider',()=>initMap());
bindSelect('s-map-style','mapStyle',()=>initMap());
bindSelect('s-route-provider','routeProvider');
bindSelect('s-voice-mode','voiceMode');
bindSelect('s-voice-engine','voiceEngine');

/* 3D buildings toggle */
const sw3d=document.getElementById('s-3d');
function sync3d(){sw3d.classList.toggle('on',S.buildings3d);}
sw3d.onclick=()=>{
  S.buildings3d=!S.buildings3d;
  saveS('buildings3d',S.buildings3d);
  sync3d();
  if(!map)return;
  if(S.buildings3d)add3DBuildings();else remove3DBuildings();
};
sync3d();

/* car position */
const carXEl=document.getElementById('s-car-x');
const carYEl=document.getElementById('s-car-y');
const carXVal=document.getElementById('v-car-x');
const carYVal=document.getElementById('v-car-y');
function syncCar(){
  carXEl.value=S.carX;carYEl.value=S.carY;
  carXVal.textContent=S.carX+'%';carYVal.textContent=S.carY+'%';
  updateCarPos();
  applyCarPadding(); // re-ancla el centro del mapa al coche al moverlo
}
carXEl.addEventListener('input',()=>{saveS('carX',+carXEl.value);syncCar();});
carYEl.addEventListener('input',()=>{saveS('carY',+carYEl.value);syncCar();});
syncCar();

/* cámara: pitch, zoom, orientación y anclaje */
const pitchEl=document.getElementById('s-pitch');
const zoomEl=document.getElementById('s-zoom');
const pitchVal=document.getElementById('v-pitch');
const zoomVal=document.getElementById('v-zoom');
function syncCam(){
  pitchEl.value=S.pitch;zoomEl.value=S.zoom;
  pitchVal.textContent=Math.round(S.pitch)+'°';zoomVal.textContent=S.zoom;
  if(!isFlying)updateCamera();
  updateCarRotation();
}
pitchEl.addEventListener('input',()=>{saveS('pitch',+pitchEl.value);syncCam();});
zoomEl.addEventListener('input',()=>{saveS('zoom',+zoomEl.value);syncCam();});
syncCam();

const swHeading=document.getElementById('s-heading');
const swFollow=document.getElementById('s-follow');
function syncToggles(){
  swHeading.classList.toggle('on',S.heading);
  swFollow.classList.toggle('on',S.follow);
  updateCarRotation();
  if(!isFlying)updateCamera();
}
swHeading.onclick=()=>{S.heading=!S.heading;saveS('heading',S.heading);syncToggles();};
swFollow.onclick=()=>{S.follow=!S.follow;saveS('follow',S.follow);syncToggles();
  if(!S.follow&&map)map.setPadding({left:0,right:0,top:0,bottom:0});
  else applyCarPadding();
};
syncToggles();

/* voice test */
document.getElementById('btn-test-voice').onclick=()=>{
  if(S.voiceMode==='silence'){toast('El modo de voz está en silencio');return;}
  if(S.voiceMode==='sounds'){alertSound('medium');return;}
  speak('En quinientos metros, gire a la derecha');
};
document.getElementById('btn-test-beep').onclick=()=>alertSound('medium');

/* ---------- boot ---------- */
initMap();
updateCarPos();
